name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build & Push to GHCR

    runs-on: arc-prod-adler-docker-smartlinks
    timeout-minutes: 20
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1g
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check ARC cache contract
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/publish.yml --job "$GITHUB_JOB"

      - name: Verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

        with:
          cache-disabled: true

      - name: Prepare independent Gradle home
        run: /opt/arc-cache/arc-cache gradle-prepare --user-home "$HOME/.gradle"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      # Именно `build`, а не `bootJar -x test`: workflow идёт на тот же push, что и тесты,
      # но независимо от него, поэтому с `-x test` в GHCR уезжал бы образ с красными тестами.
      - name: Build and test application JAR
        run: ./gradlew build --no-daemon --max-workers=2

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smart-links-image-context"
          jar="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)"
          test -n "$jar"
          cp "$jar" "$RUNNER_TEMP/smart-links-image-context/app.jar"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

        with:
          name: arc-persistent
          keep-state: true
          buildkitd-config: /opt/arc-cache/buildkitd.toml

      - name: Prepare persistent layer cache
        run: /opt/arc-cache/arc-cache buildx-prepare

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse overwriting a release image
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          if result=$(docker manifest inspect "ghcr.io/krotname/smart-links:$RELEASE_VERSION" 2>&1); then
            echo "Release image already exists: $RELEASE_VERSION" >&2
            exit 1
          elif [[ "$result" != *"manifest unknown"* && "$result" != *"no such manifest"* ]]; then
            echo "Cannot verify that the release image is absent" >&2
            exit 1
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/krotname/smart-links
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_type == 'tag' }}

      - name: Prepare pinned runtime through ARC OCI cache
        run: bash scripts/prepare-runtime-oci.sh

      - name: Build and push
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ runner.temp }}/smart-links-image-context
          file: ./Dockerfile.runtime
          build-args: RUNTIME_IMAGE=runtime
          build-contexts: runtime=${{ env.RUNTIME_OCI_CONTEXT }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          builder: arc-persistent
          cache-from: type=local,src=${{ env.ARC_BUILDX_CACHE_FROM }}
          cache-to: type=local,dest=${{ env.ARC_BUILDX_CACHE_TO }},mode=min,ignore-error=true

      - name: Save successful layer cache
        run: /opt/arc-cache/arc-cache buildx-save

      - name: Record immutable artifact
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: printf '%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
