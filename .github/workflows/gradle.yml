name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests / Gradle
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx1g
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      TESTCONTAINERS_RYUK_DISABLED: 'true'

    runs-on: arc-prod-adler-docker-smartlinks

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check ARC cache contract
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/gradle.yml --job "$GITHUB_JOB"
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-disabled: true
      - name: Prepare independent Gradle home
        run: /opt/arc-cache/arc-cache gradle-prepare --user-home "$HOME/.gradle"

      - name: Build with Gradle Wrapper
        run: ./gradlew build jacocoTestReport --no-daemon --max-workers=2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

        with:
          name: arc-persistent
          keep-state: true
          buildkitd-config: /opt/arc-cache/buildkitd.toml

      - name: Prepare persistent layer cache
        run: /opt/arc-cache/arc-cache buildx-prepare

      - name: Stage application JAR
        run: cp build/libs/SmartLinks-0.1.0.jar app.jar
      - name: Prepare pinned runtime through ARC OCI cache
        run: bash scripts/prepare-runtime-oci.sh
      - name: Build runtime container
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: .
          file: Dockerfile.runtime
          build-args: RUNTIME_IMAGE=runtime
          build-contexts: runtime=${{ env.RUNTIME_OCI_CONTEXT }}
          builder: arc-persistent
          cache-from: type=local,src=${{ env.ARC_BUILDX_CACHE_FROM }}
          cache-to: type=local,dest=${{ env.ARC_BUILDX_CACHE_TO }},mode=min,ignore-error=true
          push: false
      - name: Save successful layer cache
        run: /opt/arc-cache/arc-cache buildx-save

      - name: Upload coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-csv
          path: build/JacocoReportDir/jacoco.csv
          if-no-files-found: error

          retention-days: 7
  badge:
    name: Update coverage badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: arc-prod-adler-docker-smartlinks
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check ARC cache contract
        run: /opt/arc-cache/arc-cache check-workflow --file .github/workflows/gradle.yml --job "$GITHUB_JOB"

      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: jacoco-csv
          path: build/JacocoReportDir

      - name: Generate Coverage Badge
        uses: cicirello/jacoco-badge-generator@72266185b7ee48a6fd74eaf0238395cc8b14fef8 # v2.12.1
        with:
          jacoco-csv-file: build/JacocoReportDir/jacoco.csv

      - name: Commit coverage badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/
          git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push
