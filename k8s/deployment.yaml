apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-links-deployment
  labels:
    app: smart-links
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-links
  template:
    metadata:
      labels:
        app: smart-links
    spec:
      containers:
        - name: smart-links-container
          # Replace with the verified release digest before applying to production.
          image: ghcr.io/krotname/smart-links:0.2.0
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SERVER_FORWARD_HEADERS_STRATEGY
              value: framework
            - name: SMARTLINKS_OWNER_HOST
              value: links.n-0.ru
            - name: SMARTLINKS_PUBLIC_BASE_URL
              value: https://n-0.ru
            - name: SMARTLINKS_OWNER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smart-links-owner
                  key: username
            - name: SMARTLINKS_OWNER_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: smart-links-owner
                  key: password-hash
            # Shared key for POST /api/** (X-API-Key header). Redirects stay public.
            # Create it before applying this manifest, e.g.:
            #   kubectl create secret generic smart-links-api-key \
            #     --from-literal=api-key="$(openssl rand -base64 32)"
            # Missing required Kubernetes secrets prevent startup; empty values fail closed.
            - name: SMARTLINKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-links-api-key
                  key: api-key
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
