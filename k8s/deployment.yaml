apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-links-deployment
  labels:
    app: smart-links
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-links
  template:
    metadata:
      labels:
        app: smart-links
    spec:
      containers:
        - name: smart-links-container
          image: ghcr.io/krotname/smart-links:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            # Shared key for POST /api/** (X-API-Key header). Redirects stay public.
            # Create it before applying this manifest, e.g.:
            #   kubectl create secret generic smart-links-api-key \
            #     --from-literal=api-key="$(openssl rand -base64 32)"
            # Without the secret the pod still serves redirects but rejects every write with 401.
            - name: SMARTLINKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-links-api-key
                  key: api-key
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
