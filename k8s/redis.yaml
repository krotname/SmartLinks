apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: smart-links-redis
spec:
  type: ClusterIP
  selector:
    app: smart-links-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smart-links-redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: smart-links-redis
  template:
    metadata:
      labels:
        app: smart-links-redis
    spec:
      containers:
        - name: redis
          image: redis:8.2-alpine@sha256:94589dc90eb8b7eb920f3a9a6d85657e73fd20db61410719500b9c5ba0548d9a
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smart-links-redis-ingress
spec:
  podSelector:
    matchLabels:
      app: smart-links-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: smart-links
      ports:
        - protocol: TCP
          port: 6379
