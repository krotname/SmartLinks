volumes:
  redis_data_lt:
services:
  redis:
    image: redis:8.2-alpine@sha256:94589dc90eb8b7eb920f3a9a6d85657e73fd20db61410719500b9c5ba0548d9a
    volumes:
      - redis_data_lt:/data
  app:
    image: smart-links:latest
    ports:
      - "8090:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATA_REDIS_HOST=redis
    depends_on:
      - redis
