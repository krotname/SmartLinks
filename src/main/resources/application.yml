smartlinks:
  # Shared key required on write requests (POST /api/**) via the X-API-Key header.
  # Supply it through the SMARTLINKS_API_KEY environment variable — never commit a real key.
  # Left blank the service still starts and keeps serving redirects, but every write is
  # rejected with 401 (fail closed).
  api-key: ${SMARTLINKS_API_KEY:}
  reserved-codes: ${SMARTLINKS_RESERVED_IDS:}
  public-base-url: ${SMARTLINKS_PUBLIC_BASE_URL:https://n-0.ru}
  owner:
    host: ${SMARTLINKS_OWNER_HOST:links.n-0.ru}
    username: ${SMARTLINKS_OWNER_USERNAME:}
    password-hash: ${SMARTLINKS_OWNER_PASSWORD_HASH:}
spring:
  application:
    name: SmartLinks
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2s
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2s
  session:
    data:
      redis:
        namespace: spring:session
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    read:
      strict-duplicate-detection: true
    factory:
      constraints:
        read:
          max-nesting-depth: 32
          max-document-length: 262144
          max-token-count: 10000
          max-string-length: 4096
          max-name-length: 128
springdoc:
  swagger-ui:
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    url: /v3/api-docs
    use-root-path: true
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        secure: true
        http-only: true
        same-site: strict
  tomcat:
    max-connections: 10000
    accept-count: 1000
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,redis
        liveness:
          include: livenessState
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
logging:
  level:
    root: INFO
    # DEBUG включает профиль dev (docker-compose.yml): в k8s стоит SPRING_PROFILES_ACTIVE=prod,
    # и отладочный уровень на публичном редиректе там не нужен.
    name.krot.smartlinks: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
